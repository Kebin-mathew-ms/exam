apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  labels:
    app: aegis-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aegis-backend
  template:
    metadata:
      labels:
        app: aegis-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "{{ .Values.database.url }}"
            - name: REDIS_URL
              value: "{{ .Values.cache.url }}"
            - name: SECRET_KEY
              value: "{{ .Values.secretKey }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          healthCheck:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-backend-service
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: aegis-backend
